[project]
name = "runtime-voice-labs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
voice = ["pipecat-ai[livekit,deepgram,openai,cartesia,elevenlabs]>=0.0.102"]
test = ["pytest>=8.0"]

[project.scripts]
voice-labs-runtime = "src.runtime.worker:main"

[tool.pytest.ini_options]
pythonpath = ["."]

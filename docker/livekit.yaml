# LiveKit server config for the local compose stack (API keys come from LIVEKIT_KEYS in compose.yml).
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Advertise this IP in ICE candidates. 127.0.0.1 lets a browser on the Docker host
  # (including macOS/colima, where container IPs are not routable) reach media through
  # the published ports. Change for LAN / remote use (see README "Run with Docker").
  node_ip: 127.0.0.1
  use_external_ip: false
